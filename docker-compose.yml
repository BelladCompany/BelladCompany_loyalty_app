services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: loyalty_user
      POSTGRES_PASSWORD: loyalty_pass
      POSTGRES_DB: loyalty_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .              # ← changed from ./backend to . (root, since your code is here)
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://loyalty_user:loyalty_pass@postgres:5432/loyalty_db
      JWT_SECRET: your_jwt_secret_here
      PORT: 5000
    ports:
      - "5050:5000"

  frontend:
    build: ./client        # ← changed from ./frontend to ./client
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: