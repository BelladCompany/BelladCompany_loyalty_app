services:
  postgres:
    image: postgres:16-alpine
    container_name: loyalty_postgres
    restart: always
    environment:
      POSTGRES_USER: loyalty_user
      POSTGRES_PASSWORD: loyalty_pass
      POSTGRES_DB: loyalty_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty_user -d loyalty_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loyalty_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://loyalty_user:loyalty_pass@postgres:5432/loyalty_db
      JWT_SECRET: super_secret_jwt_key_enterprise_loyalty_2026
      DEFAULT_TENANT_ID: bellad_and_company
      ENABLE_DEBUG_OTP: "true"
      USE_DUMMY_OTP: "true"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    command: sh -c "node src/db/migrate.js && node src/db/seed.js && node src/index.js"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: loyalty_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: