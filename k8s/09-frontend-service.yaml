apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: loyalty-system
  labels:
    app: frontend
    app.kubernetes.io/name: bellad-loyalty
    app.kubernetes.io/component: web-frontend
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 80
      name: http-web-8080
      protocol: TCP
    - port: 30080
      targetPort: 80
      name: http-web-30080
      protocol: TCP
  selector:
    app: frontend

