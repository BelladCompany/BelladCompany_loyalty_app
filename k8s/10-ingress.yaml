apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loyalty-ingress
  namespace: loyalty-system
  labels:
    app.kubernetes.io/name: bellad-loyalty
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: "backend-service"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - loyalty.belladandcompany.com
      secretName: loyalty-tls-cert
  rules:
    - host: loyalty.belladandcompany.com
      http:
        paths:
          # 1. API Endpoints routed directly to backend service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000

          # 2. Uploads & Attachments
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000

          # 3. Health check
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000

          # 4. React Single Page Web Application (fallback for all UI routes)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
