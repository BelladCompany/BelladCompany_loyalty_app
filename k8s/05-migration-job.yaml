apiVersion: batch/v1
kind: Job
metadata:
  name: loyalty-db-migration
  namespace: loyalty-system
  labels:
    app.kubernetes.io/name: bellad-loyalty
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: loyalty-migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Wait for PostgreSQL to be accepting connections
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres-service:5432..."
              until nc -z -w 2 postgres-service 5432; do
                echo "Postgres is unavailable - sleeping 3s"
                sleep 3
              done
              echo "Postgres is UP and reachable!"
      containers:
        - name: migrate
          image: belladcompany/loyalty-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "node src/db/migrate.js && node src/db/seed.js"]
          envFrom:
            - configMapRef:
                name: loyalty-config
            - secretRef:
                name: loyalty-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

