apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: loyalty-system
  labels:
    app: frontend
    app.kubernetes.io/name: bellad-loyalty
    app.kubernetes.io/component: web-frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: bellad-loyalty
        app.kubernetes.io/component: web-frontend
    spec:
      containers:
        - name: loyalty-frontend
          image: belladcompany/loyalty-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http-web
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
