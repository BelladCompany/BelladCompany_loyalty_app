apiVersion: v1
kind: Secret
metadata:
  name: loyalty-secrets
  namespace: loyalty-system
  labels:
    app.kubernetes.io/name: bellad-loyalty
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # PostgreSQL Credentials (used by Postgres StatefulSet and Backend)
  POSTGRES_USER: "loyalty_user"
  POSTGRES_PASSWORD: "loyalty_secure_pass_2026"
  POSTGRES_DB: "loyalty_db"
  DATABASE_URL: "postgres://loyalty_user:loyalty_secure_pass_2026@postgres-service:5432/loyalty_db"

  # JWT & Session Cryptographic Keys
  JWT_SECRET: "bellad_jwt_production_master_secret_key_2026_secure"
  SESSION_SECRET: "bellad_session_vault_key_2026_super_secure"
  ENCRYPTION_KEY: "bellad_aes256_encryption_master_key_2026"

  # External Integration API Keys
  DMS_API_KEY: "bac_live_dms_7f8a9b0c1d2e3f4a5b6c"
  REALBOOKS_API_KEY: "bac_live_realbooks_9c8b7a6d5e4f3a2b1c"
  APPSHEET_WEBHOOK_KEY: "bac_live_appsheet_1a2b3c4d5e6f7a8b9c"
  MASTER_INTEGRATION_KEY: "bac_live_master_bellad_loyalty_2026"

  # WhatsApp Gateway Provider Token
  WHATSAPP_API_TOKEN: "reltigrow_live_production_token_2026"
