services:
  # Backend Web Service (Node.js Express + Database Migrations)
  - type: web
    name: bellad-loyalty-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/db/migrate.js && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: bellad-loyalty-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_TENANT_ID
        value: bellad_and_company
      - key: FRONTEND_URL
        value: https://bellad-company-loyalty.vercel.app

databases:
  # Managed PostgreSQL Database on Render
  - name: bellad-loyalty-db
    databaseName: loyalty_db
    user: loyalty_user
    plan: free
